# Configuration schema for PULSE (Point-Level Understanding & Strategic Leverage Engine)
# All quantitative thresholds, model parameters, and latency budgets source from here (FR-8).

thresholds:
  leverage_escalation: 0.10       # Leverage threshold to trigger PressureDiagnosticNode (calibrate in Phase 3)
  exploit_min_sample_size: 30     # Opponent minimum observation count for StrategyExploitNode (ADR-003)
  game_theory_3x3_min_sample_size: 50 # Minimum opponent observation count to include 3 serve directions (D-2a)

uncertainty:
  confidence_level: 0.95          # 95% Wilson score confidence interval (z = 1.95996) per ADR-005
  min_stratum_observations: 10   # Tier 0: Minimum observations for exact (player, surface, serve_number)
  min_player_observations: 20     # Tier 1: Minimum observations for overall player serve rate
  min_surface_observations: 50    # Tier 2: Minimum observations for population surface serve rate
  default_fallback_margin: 0.15   # +/- margin around default_p when falling back to Tier 3

solver:
  tolerance: 1.0e-9               # Hard CI-blocking solver tolerance gate vs closed-form theory
  default_p_serve: 0.62           # Fallback point-win probability when stratum observations < min

ingestion:
  raw_data_dir: "data/raw"
  validated_data_dir: "artifacts/validated_data"
  validated_file_name: "points.parquet"

latency:
  state_monitor_ms: 1000          # Per-point latency budget for StateMonitorNode (NFR: < 1s)
  triggered_node_ms: 5000         # Latency budget for triggered diagnostic/exploit nodes (NFR: < 5s)

llm:
  provider: "anthropic"           # Single small/cheap LLM provider for narrative synthesis (D-7)
  model_name: "claude-3-5-haiku-20241022" # Instruction-following Haiku-class model
  max_tokens: 300                 # Output token limit for narrative synthesis
  temperature: 0.2                # Low temperature for deterministic/faithful text synthesis
  request_timeout_s: 4.0          # Timeout budget in seconds (< 5s triggered node budget)

models:
  calibration_method: "sigmoid"   # Required: "sigmoid" for LogisticRegression v1; "isotonic" for LightGBM v2 (ADR-006)
  point_win_classifier: "hierarchical_stratum_estimator" # Amended ADR-005 estimator class
  solver_tolerance: 1.0e-9        # Compatibility alias for solver tolerance
  train_test_split: 0.20          # Holdout fraction for classifier evaluation
  random_state: 42                # Reproducibility seed for train/test split and model fit
  max_mean_absolute_calibration_error: 0.015
  min_holdout_auc_sanity: 0.55
  mlflow_experiment_classifier: "pulse_point_win_classifier_v1"
  mlflow_experiment_pressure: "pulse_pressure_deviation_v1"

  # Empirical-Bayes Shrinkage Priors & Fallback Thresholds (Pressure Deviation Model)
  pressure_prior_alpha: 2.0       # Fallback Beta prior alpha (weak 4-observation prior)
  pressure_prior_beta: 2.0        # Fallback Beta prior beta
  pressure_prior_min_players_per_bucket: 15 # Minimum players in bucket required to fit MLE prior

  # Empirical-Bayes Shrinkage Priors & Fallback Thresholds (Game Theory Module)
  game_theory_prior_alpha: 2.0    # Beta prior alpha for payoff matrix cell win rates (D-5)
  game_theory_prior_beta: 2.0     # Beta prior beta for payoff matrix cell win rates (D-5)
  game_theory_min_observations_per_cell: 5 # Min observations per cell (effectively per-serve-direction under stylized model)
  game_theory_anticipation_boost: 0.12     # Server win rate increase when returner covers opposite direction
  game_theory_positioning_penalty: 0.05    # Server win rate drop when returner covers serve direction

  # Leverage bucket upper boundaries (exclusive). Partition for per-bucket pressure deviation estimation.
  # [0.10, 0.25] produces 3 buckets: [0, 0.10) Routine, [0.10, 0.25) Elevated, [0.25, 1.0] Critical.
  pressure_leverage_buckets: [0.10, 0.25]

ci:
  line_ceiling: 1000              # Maximum allowed line count for any Python source file under src/ (§5.1)
  min_coverage_pct: 70            # Minimum required code coverage percentage for pytest

api:
  host: "127.0.0.1"               # Host address for FastAPI streaming server
  port: 8000                      # Port for FastAPI streaming server
  sse_keep_alive_interval_s: 15.0 # Periodic SSE keep-alive comment interval (D-5)
  db_path: "artifacts/pulse_session.db" # SQLite escalation log persistence database path (D-4)

simulator:
  default_interval_s: 2.0         # Default synthetic inter-point interval in seconds (D-6)
  default_speed_multiplier: 1.0   # Default playback speed multiplier (0.0 for instant replay)