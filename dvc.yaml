# DVC Pipeline Orchestrator — PULSE
# Governs data ingestion, schema validation, model training, and solver evaluation.

stages:
  ingest:
    cmd: uv run python scripts/ingest.py
    deps:
      - scripts/ingest.py
      - src/schemas/point_record.py
      - data/raw
    params:
      - ingestion.raw_data_dir
      - ingestion.validated_data_dir
      - ingestion.validated_file_name
    outs:
      - artifacts/validated_data/points.parquet

  train_classifier:
    cmd: uv run python scripts/train_classifier.py
    deps:
      - scripts/train_classifier.py
      - src/models/point_win_classifier.py
      - src/config/loader.py
      - artifacts/validated_data/points.parquet
      - params.yaml
    params:
      - models.train_test_split
      - models.random_state
      - models.calibration_method
      - models.mlflow_experiment_classifier
      - uncertainty.min_stratum_observations
      - uncertainty.confidence_level
      - solver.default_p_serve
    outs:
      - artifacts/models/point_win_classifier/
    metrics:
      - artifacts/metrics/classifier_metrics.json:
          cache: false

  train_pressure:
    cmd: uv run python scripts/train_pressure.py
    deps:
      - scripts/train_pressure.py
      - src/models/pressure_deviation.py
      - src/config/loader.py
      - artifacts/validated_data/points.parquet
      - artifacts/models/point_win_classifier/
      - params.yaml
    params:
      - models.pressure_prior_alpha
      - models.pressure_prior_beta
      - models.pressure_prior_min_players_per_bucket
      - models.pressure_leverage_buckets
      - models.mlflow_experiment_pressure
      - models.random_state
    outs:
      - artifacts/models/pressure_deviation/
    metrics:
      - artifacts/metrics/pressure_metrics.json:
          cache: false

  build_payoff_matrices:
    cmd: uv run python scripts/build_payoff_matrices.py
    deps:
      - scripts/build_payoff_matrices.py
      - src/core/game_theory.py
      - src/config/loader.py
      - artifacts/validated_data/points.parquet
      - params.yaml
    params:
      - thresholds.exploit_min_sample_size
      - thresholds.game_theory_3x3_min_sample_size
      - models.game_theory_prior_alpha
      - models.game_theory_prior_beta
      - models.game_theory_min_observations_per_cell
    outs:
      - artifacts/models/game_theory/
    metrics:
      - artifacts/metrics/game_theory_metrics.json:
          cache: false

  evaluate:
    cmd: echo "Stage not yet implemented — Phase 6 Evaluation Suite & Solver Gate"
    deps:
      - params.yaml
