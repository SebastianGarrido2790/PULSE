# DVC Pipeline Orchestrator — PULSE
# Governs data ingestion, schema validation, model training, and solver evaluation.

stages:
  ingest:
    cmd: uv run python scripts/ingest.py
    deps:
      - scripts/ingest.py
      - src/schemas/point_record.py
      - data/raw
    params:
      - ingestion.raw_data_dir
      - ingestion.validated_data_dir
      - ingestion.validated_file_name
    outs:
      - data/validated/points.parquet

  train_classifier:
    cmd: echo "Stage not yet implemented — Phase 2 Tier 1 Point-Win Classifier"
    deps:
      - data/raw
      - params.yaml

  train_pressure:
    cmd: echo "Stage not yet implemented — Phase 2 Tier 1 Pressure Deviation Model"
    deps:
      - data/raw
      - params.yaml

  evaluate:
    cmd: echo "Stage not yet implemented — Phase 6 Evaluation Suite & Solver Gate"
    deps:
      - params.yaml
