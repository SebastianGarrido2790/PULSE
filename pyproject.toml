[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse"
version = "0.1.0"
description = "Point-Level Understanding & Strategic Leverage Engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "PULSE Core Team" }
]
dependencies = [
    "pydantic>=2.0.0",
    "langgraph>=0.0.1",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "pandera>=0.18.0",
    "dvc>=3.0.0",
    "mlflow>=2.10.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "structlog>=24.1.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pyyaml>=6.0",
    "anthropic>=0.121.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-ordering>=0.6",
    "ruff>=0.2.0",
    "pyright>=1.1.350",
    "deepeval>=1.0.0",
    "pre-commit>=3.6.0",
    "rich>=13.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "RUF", # Ruff-specific rules
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --showlocals"
markers = [
    "solver: closed-form Markov solver correctness tests",
    "integration: graph and system integration tests",
    "evals: deep-eval groundedness tests",
]
