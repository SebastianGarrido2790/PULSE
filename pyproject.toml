[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse"
version = "0.1.0"
description = "Point-Level Understanding & Strategic Leverage Engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "PULSE Core Team" }
]
dependencies = [
    "pydantic>=2.0.0",
    "langgraph>=0.0.1",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "pandera>=0.18.0",
    "dvc>=3.0.0",
    "mlflow>=2.10.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "structlog>=24.1.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pyyaml>=6.0",
    "anthropic>=0.121.0",
    "groq>=0.11.0",
    "aiosqlite>=0.20.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-ordering>=0.6",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.2.0",
    "pyright>=1.1.350",
    "deepeval>=1.0.0",
    "pre-commit>=3.6.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
]

[project.scripts]
"api.main" = "src.api.main:run_server"
"simulator.replay" = "src.simulator.replay:run_cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]



[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "RUF", # Ruff-specific rules
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --showlocals"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "solver: closed-form Markov solver correctness tests",
    "integration: graph and system integration tests",
    "evals: deep-eval groundedness tests",
    "asyncio: asyncio test marker",
]
filterwarnings = [
    "error",
    "ignore:.*Using `httpx` with `starlette\\.testclient` is deprecated.*:starlette.exceptions.StarletteDeprecationWarning",
    "ignore:.*unclosed <socket\\.socket.*:ResourceWarning",
    "ignore:.*unclosed <socket\\.socket.*:pytest.PytestUnraisableExceptionWarning",
    "ignore:.*Event loop is closed.*:RuntimeWarning",
    "ignore:.*Exception ignored in.*:pytest.PytestUnraisableExceptionWarning",
]


